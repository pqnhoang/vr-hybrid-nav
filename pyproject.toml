[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vlnav"
version = "0.0.1"
description = "VL-Nav re-implementation (arXiv:2502.00931v7)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "opencv-python",
    "scikit-image",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest"]
io = ["mcap", "rosbags"]
perception = ["torch", "ultralytics", "clip @ git+https://github.com/openai/CLIP.git"]
vlm = ["transformers>=4.57", "accelerate", "openai", "pillow"]
viz = ["rerun-sdk==0.30.2"]
calib = ["open3d"]                     # scripts/calibrate_lidar_camera.py only

[tool.setuptools.packages.find]
include = ["vlnav*"]

[tool.setuptools.package-data]
"vlnav.memory" = ["prompts/*.j2"]
"vlnav.acquisition" = ["prompts/*.j2"]
"vlnav.planner" = ["prompts/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a GPU",
    "habitat: needs habitat-sim",
]
