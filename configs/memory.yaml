# Unified Memory (plans/TASK_unified_memory.md §14). Keys marked "+" are additions of the first build.
memory_rate_hz: 2.0
gating:
  min_obs_score: 0.1
  min_points: 5
  max_obs_range_m: 8.0
  min_bbox_area_px: 400
  ignore_labels: [floor, wall, ceiling]
consolidation:
  same_object_mask_iou: 0.7
association:
  assoc_radius_m: 0.5
  assoc_label_sim: 0.85
  assoc_voxel_m: 0.05
  assoc_overlap_min: 0.2
  overlap_norm: min                  # + spec: observation; min fixes partial-view -> close-view misses
  assoc_close_m: 0.25
  w_dist: 0.2
nodes:
  max_node_voxels: 4000
  min_obs: 2
  confirm_score: 0.5
best_view:
  border_penalty: 0.0
  small_penalty: 0.0
  best_view_min_area_px: 2500
  best_view_min_gain: 0.0
  best_view_require_free: true
maintenance:
  dedup_every_s: 10
  dedup_overlap_min: 0.3
  prune_every_s: 10
  prune_age_s: 60
  negative_evidence: false
rooms:
  enabled: true
  room_update_every_s: 10
  room_update_min_new_m2: 2.0
  room_grid_res_m: 0.1
  closing_kernel_m: 0.2
  min_free_comp_m2: 1.0
  door_width_m: 0.9
  min_seed_area_m2: 2.0
  min_room_area_m2: 3.0
  min_shared_border_m: 0.5
  room_iou_min: 0.3
  relabel_iou: 0.6
  relabel_min_new_objects: 3
  room_assign_fallback_m: 0.5
  room_alias_overlap_min: 0.5        # + old room absorbed by a merge -> alias if this much of it is covered
labeling:
  room_label_set: [bedroom, bathroom, kitchen, living room, dining room, office, meeting room,
                   hallway, entryway, storage, garage, laundry room, outdoor]
  room_label_max_objects: 20
  room_label_min_objects: 2
  timeout_s: 30                      # + LLM request timeout
  cache_area_bucket_m2: 5.0          # + area bucket of the label cache key
  worker_thread: true                # §8.3: LLM requests in a worker thread (false: inline, tests)
queries:
  max_neighbors: 6
images:
  image_jpeg_quality: 90
  crop_cache_size: 256
checkpoints:
  checkpoint_every_s: 10
  max_checkpoints: 0
  exact_snapshots: false
stats:
  window: 500                        # + number of recent timings kept for p50/p95
