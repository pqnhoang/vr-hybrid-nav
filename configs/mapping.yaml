# Shared 2D occupancy grid (SYSTEM.md §4.3). Owned by the core process; memory (rooms,
# best-view validity) and exploration read it. Heights are relative to the estimated ground.
resolution: 0.05
initial_size_m: 20.0           # first allocation, centered on the first sensor origin
grow_margin_m: 10.0            # extra border allocated when data leaves the grid
max_range_m: 10.0              # points farther (horizontally) than this from the sensor are ignored
max_points: 80000              # obstacle-hit points per update (random subsample, seeded)
ray_angle_bins: 1440           # free-space rays: one per azimuth bin (0.25 deg), to the farthest evidence
ray_step_factor: 0.7           # ray sample step = factor * resolution (< 1: no skipped cells)
obstacle_z_min: 0.15           # obstacle: height above ground in [min, max]
obstacle_z_max: 1.8            # higher points (overhead / ceiling) are ignored
negative_obstacles: false      # optional in SYSTEM §4.3, not implemented (must stay false)
seed: 0
ground:
  mode: cell_min               # cell_min: per-cell min z + smoothing (robot) | constant: fixed floor (sim)
  constant_z: 0.0              # mode constant
  smooth_radius_m: 0.5         # cell_min: ground = min of per-cell min z within this radius
log_odds:
  hit: 0.85
  miss: -0.4
  clamp_min: -2.0
  clamp_max: 3.5
  occupied_threshold: 0.7      # >= -> occupied
  free_threshold: -0.7         # <= -> free; in between (or never observed) -> unknown
depth_points:                  # frames without LiDAR: dense depth -> points (perception/depth_utils)
  stride: 4
  min_depth_m: 0.3
  max_depth_m: 6.0
external:                      # ExternalGrid: nav_msgs/OccupancyGrid occupancy values (0..100, -1)
  occupied_threshold: 65
  free_threshold: 25
